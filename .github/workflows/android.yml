name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        id: signing
        env:
          SIGNING_PASSWORD: ${{ secrets.DOCK_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error title=Signing key missing::Add the DOCK_SIGNING_PASSWORD repo secret. Without it the APK is debug-signed and is NOT published, because it could not be installed as an update."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in android/signing/dock.keystore.enc -out "$RUNNER_TEMP/dock.keystore" \
            -pass env:SIGNING_PASSWORD
          {
            echo "DOCK_KEYSTORE=$RUNNER_TEMP/dock.keystore"
            echo "DOCK_KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
            echo "DOCK_KEY_PASSWORD=$SIGNING_PASSWORD"
            echo "DOCK_KEY_ALIAS=dock"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -E -A4 "error:|^e: |What went wrong|ERROR|AAPT|FAILURE" build.log | head -60 \
                | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pwa-dock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dock-apk
          path: pwa-dock.apk

      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          # Fail rather than publish an APK signed with anything but the Dock release key
          keytool -printcert -jarfile pwa-dock.apk | tee cert.txt
          grep -q "40:02:53:20:D3:4D:1E:02:2E:1C:2F:D5:4D:99:8C:DC:18:91:07:D9:92:90:EA:B5:B9:44:D9:16:40:0E:EB:ED" cert.txt

      - name: Publish to "apk-latest" release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest pwa-dock.apk \
            --target "$GITHUB_SHA" \
            --title "Dock APK (build ${{ github.run_number }})" \
            --notes "Latest Android build of Dock from commit ${GITHUB_SHA::7}. Download pwa-dock.apk on your phone and open it to install (allow installs from your browser when prompted)." \
            --latest
